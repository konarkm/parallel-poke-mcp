services:
  - type: web
    name: parallel-poke-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python src/server.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PARALLEL_API_KEY
        sync: false
      - key: PARALLEL_WEBHOOK_SECRET
        sync: false
      - key: POKE_API_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
